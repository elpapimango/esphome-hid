# An ESP32-S3 that the PC sees as a Stream Deck XL (32 keys); every key is a button in Home Assistant.
# The native USB port is the Stream Deck; flash over the board's UART port (or hold BOOT while plugging in the native one).
esphome:
  name: esp-streamdeck
  friendly_name: ESP Stream Deck
  platformio_options:
    build_flags:
      - -DCFG_TUD_HID=1
      # the 1024-byte output report (key images) and the 512-byte input report each go in one transfer
      - -DCFG_TUD_HID_EP_BUFSIZE=1024

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_USJ_ENABLE_USB_SERIAL_JTAG: "n"
      CONFIG_TINYUSB_HID_COUNT: "1"
      CONFIG_ESP_CONSOLE_UART_DEFAULT: "y"
    components:
      - espressif/esp_tinyusb~2.0.0

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: ../components
    components: [hid_streamdeck]

hid_streamdeck:
  id: deck
  image_port: 8080  # http://<device>:8080/ shows the key images the PC sent

binary_sensor:
  - platform: hid_streamdeck
    connected:
      name: "Stream Deck connected"

sensor:
  - platform: hid_streamdeck
    brightness:
      name: "Stream Deck brightness"
    images:
      name: "Stream Deck images received"

button:
  # All 32 keys of the XL, named by their place on the grid: "Key R<row>C<column>", row 0 at the top, column 0 at the left.
  # Generated with: python tools/gen_streamdeck_buttons.py
  - platform: hid_streamdeck
    name: "Key R0C0"
    row: 0
    column: 0
